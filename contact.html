<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!--Linking all style sheets, media -->
    <link rel="stylesheet" type="text/css" href="phone.css" media="only screen and (max-width:480px)">
    <link rel="stylesheet" type="text/css" href="tablet.css" media="only screen and (min-width:481px) and (max-width:960px)">
    <link rel="stylesheet" type="text/css" href="desktop.css" media="only screen and (min-width:961px)">
    <title>Contact Me</title>
</head>
<body>
    
    <div id="wrapper">
        <header>
            <h1>Contact Me</h1>
            <nav> 
                <!--Navigation links to the four pages-->
                <a href="home.html">Home</a>
                <a href ="about.html">About</a>
                <a href ="projects.html">Projects</a>
                <a href ="contact.html">Contact</a>
                
            </nav>
        </header>
        
        <form action="mailto:janice.nanteza@ontariotechu.net?subject=Questions from website"
              method="post" enctype="text/plain" name="inquiry_form">
            <!--All form properties:action, method, enctype and name-->
            <h1> Have any Inquires or Comments? Fill the form below</h1>
            <!--Header to let user know what to do with the form-->
            <p> 
                <label for="FName">First Name:</label>
                <input type="text" id="FName" size="29" placeholder="Enter your first name" required>
                <!--Placeholder adding a more interactive apporach, required ensures the field is filled before submission-->
            </p>
            <br>
            <p> 
                <label for="LName">Last Name:</label>
                <input type="text" id="LName" size="30" placeholder="Enter your last name" required>
                <!--Has only one input line-->
            </p>
            <br>
            <p>
                <label for="Email">Email: </label>
                <input type ="Email" id="Email" size="40" placeholder="Enter your email" required>
                <!--Type email makes the browser check for a vaild format-->
            </p>
            <br>
            <p>
                <label for="comments">Comments:</label>
                <textarea name="comments" cols="40" rows="4"></textarea>
                <!--Use of textarea allows for multiple lines -->
            </p>
            <br>
            <p>
                <label for="Phone">Phone Number: </label>
                <input type ="tel" id="Phone" size="30" placeholder="Enter your phone number" required>
                <!-- Checks for 10 digits keeping dashes in mind-->
            </p>
            <br>
            <p> 
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
                <!--Reset clears all form fields and submit triggers the form action-->
            </p>
        </form>
        <footer>
            <address>Email:janice.nanteza@ontariotechu.net</address>
            <p>&copy 2026 by Janice Nanteza</p>
        </footer>
    </div>
    
</body>
</html>
